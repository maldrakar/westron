name: Snapshot matrix

# The owner's review surface for the second approval gate (#24, #72), on demand only (the owner's decision of
# 2026-11-20): it compares nothing, so it is an artifact to look at, not a check, and at about 2.2 Mac runner-hours
# (4 capture legs and a page job, 2026-11-19) it no longer runs with every pull request and push to main. Two ways to
# ask for it:
#   - `gh workflow run snapshot-matrix.yml --ref <branch>` (or "Run workflow" on the Actions tab), optionally with
#     `-f components=button,text-field`, contract ids, comma-separated; empty takes every component;
#   - the label `snapshot-matrix` on a pull request: one run when the label is added, on the pull request's merge
#     commit as it is then. Later pushes do not run it again; remove the label and add it again for a fresh capture.
# Its pages compare only with another CI artifact from the same runner image (decisions/0008): download two and run
# `tools/apple/snapshot-matrix.sh compare`. Informational: it must never be a required check.
on:
  workflow_dispatch:
    inputs:
      components:
        description: Contract ids to capture, comma-separated (button,text-field); empty for every component
        required: false
        default: ''
        type: string
  pull_request:
    types: [labeled]

# A run per branch or pull request: asking again cancels the capture in progress. The label is in the group, so that
# adding any other label to the pull request, which starts a run of this workflow that does nothing, cancels nothing.
concurrency:
  group: snapshot-matrix-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  snapshot-components:
    name: Snapshot matrix — legs
    # The components the snapshot matrix captures and the legs that capture them. The components are the members of the
    # generated registry `ComponentMatrix.all` (WestronCatalog/Generated/ComponentMatrix+All.swift), which
    # `tools/westron generate` writes for every contract that gives API on Apple and the tools job holds to the
    # contracts (`generate --check`); its members are the contracts' ids in lowerCamelCase (`textField` for
    # `text-field`). The input `components` narrows them, in the registry's order; an id the registry does not hold
    # fails the job.
    #
    # The legs pack the components by their images, so that each platform takes few jobs, each with its own build:
    # first fit, the largest first, into legs of at most 40 min of capture on the runner, at 15 s an iOS image and 8 s a
    # macOS one (on CI, Button's 144 iOS images took 30–42 min and its 72 macOS ones 10–11, builds included: runs
    # 44360219942 and 44386153527). The number of images per component is not cheap to compute from the sources (the
    # supplements and the parts at accessibility5 are the catalog's Swift), so IMAGES below holds it, counted from the
    # captures' manifests (`jq '[.components[] | {(.component): ([.groups[].sheets[].images[][]] | length)}] | add'
    # matrix.json`); `snapshot-matrix-pages` warns when a capture's count differs from it. A component missing from
    # IMAGES gets 150 iOS and 150 macOS images, about a leg of its own, and a warning: add its counts then.
    # Each leg's timeout: 30 min and its capture time with a third more. The 30 hold the build and the simulator
    # (6.5–17.1 min on CI) and a capture the machinery failed before it is run again: `snapshot-matrix.sh` retries one
    # only when it starts by 25 min (WESTRON_MATRIX_RETRY_BY), and the retry, about 3 min to start the test runner and
    # the whole capture again, then ends by 28 min and the capture time with a third more, 2 min before the timeout.
    # In run 44444325775 the leg button+rule failed to launch the catalog 14.4 min in (8 min of build and setup, 2.4
    # to start the runner, 3 of the launch timing out). With the 20 min of before, a retry fitted only when it started
    # by 15 min, less than the setup alone has taken. A leg the timeout kills uploads no logs: in run 44461921450 the
    # leg of macOS went silent after the capture's header and ran 62 min into its timeout. So `snapshot-matrix.sh`
    # stops an xcodebuild whose log has not grown for 10 min (WESTRON_MATRIX_STALL_SECONDS) and counts the capture as
    # the machinery's failure, retried as above; and `snapshot-matrix` gives it a deadline 2 min before the timeout
    # (WESTRON_MATRIX_DEADLINE), the 2 min above, at which the script stops whatever it still does (an xcodebuild, the
    # export, the page) and exits 1, since a stall noticed 10 min late, or a hang outside xcodebuild, can otherwise
    # run past the timeout. A capture that would have ended within those 2 min fails then, with its logs.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'snapshot-matrix'
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.legs.outputs.components }}
      legs: ${{ steps.legs.outputs.legs }}
      images: ${{ steps.legs.outputs.images }}
    env:
      IMAGES: >-
        {"button": {"ios": 144, "macos": 72}, "checkbox": {"ios": 19, "macos": 12}, "icon": {"ios": 73, "macos": 32},
        "rule": {"ios": 7, "macos": 4}, "surface": {"ios": 24, "macos": 12}, "text": {"ios": 47, "macos": 24},
        "text-field": {"ios": 51, "macos": 28}}
    steps:
      - uses: actions/checkout@v7
      - name: Components and legs
        id: legs
        env:
          # Empty on a pull request's label.
          REQUESTED: ${{ inputs.components }}
        run: |
          set -euo pipefail
          registry=platforms/apple/Sources/WestronCatalog/Generated/ComponentMatrix+All.swift
          # grep finds nothing in an empty registry; `|| true` keeps pipefail from ending the step before it says so.
          members="$(sed -n '/static let all: \[ComponentMatrix\]/,$p' "$registry" \
            | { grep -oE '\.[A-Za-z0-9]+' || true; })"
          if [ -z "$members" ]; then
            echo "No component in $registry" >&2
            exit 1
          fi
          components="$(perl -pe 's/^\.//; s/([A-Z])/-\l$1/g' <<< "$members" | jq -R . | jq -cs .)"
          if [ -n "${REQUESTED//[ ,]/}" ]; then
            requested="$(tr ',' '\n' <<< "$REQUESTED" | tr -d ' ' | sed '/^$/d' | jq -R . | jq -cs .)"
            unknown="$(jq -r --argjson all "$components" '[.[] | select(. as $id | $all | index($id) | not)] | join(", ")' \
              <<< "$requested")"
            if [ -n "$unknown" ]; then
              echo "::error title=Snapshot matrix legs::Not in the registry: $unknown. The components:" \
                "$(jq -r 'join(", ")' <<< "$components")."
              exit 1
            fi
            components="$(jq -c --argjson want "$requested" '[.[] | select(. as $id | $want | index($id))]' \
              <<< "$components")"
          fi
          for id in $(jq -r --argjson images "$IMAGES" '.[] | select($images[.] == null)' <<< "$components"); do
            echo "::warning title=Snapshot matrix legs::No image count for $id in IMAGES" \
              "(.github/workflows/snapshot-matrix.yml); it is packed as 150 images."
          done
          legs="$(jq -c --argjson images "$IMAGES" '
            . as $ids
            | [ ("ios", "macos") as $platform
              | {ios: 15, macos: 8}[$platform] as $per
              | [ $ids[] | {id: ., images: ($images[.][$platform] // 150)} | .seconds = .images * $per ]
              | sort_by(-.seconds)
              | reduce .[] as $c ([];
                  (map(.seconds + $c.seconds <= 2400) | index(true)) as $i
                  | if $i == null then . + [{ids: [$c.id], images: $c.images, seconds: $c.seconds}]
                    else .[$i].ids += [$c.id] | .[$i].images += $c.images | .[$i].seconds += $c.seconds end)
              | .[]
              | (.ids | sort_by(. as $id | $ids | index($id))) as $ordered
              | {platform: $platform, components: ($ordered | join(",")), name: ($ordered | join("+")),
                 images: .images, timeout: (30 + (.seconds * 4 / 3 / 60 | ceil))} ]' <<< "$components")"
          echo "components=$components" | tee -a "$GITHUB_OUTPUT"
          echo "legs=$legs" | tee -a "$GITHUB_OUTPUT"
          echo "images=$(jq -c . <<< "$IMAGES")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.platform): \(.name), \(.images) images, \(.timeout) min"' <<< "$legs"

  snapshot-matrix:
    name: Snapshot matrix (${{ matrix.platform }}, ${{ matrix.name }})
    # Every combination of every contract asked for in the four themes, on iOS also at the smallest and the largest
    # text size, with the catalog's supplementary sheets. One job per leg of `snapshot-components` (its components in
    # one `xcodebuild test`, `--component a,b`), side by side, each uploaded as
    # `snapshot-matrix-<platform>-<components joined with +>`; `snapshot-matrix-pages` below puts them into one page per
    # platform.
    needs: snapshot-components
    if: ${{ !cancelled() && needs.snapshot-components.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.snapshot-components.outputs.legs) }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture
        # A capture the machinery failed (the catalog did not launch, the test runner did not start) is run once more,
        # with a warning on the run, and never one whose test reported a failure of a sheet; the first run's log stays
        # beside the retry's (`-retry.log`), and both go up below, even when the retry passed. A run whose log has
        # gone silent for 10 min counts as the machinery's failure; whatever the script still does 2 min before the
        # timeout is stopped and the step fails, so that the logs go up (`snapshot-components`).
        run: >-
          WESTRON_MATRIX_DEADLINE=$((${{ matrix.timeout }} - 2))
          tools/apple/snapshot-matrix.sh ${{ matrix.platform }} --component ${{ matrix.components }}
      - uses: actions/upload-artifact@v7
        # Also after a failed capture: the page shows what went wrong.
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-${{ matrix.platform }}-${{ matrix.name }}
          path: |
            .build/snapshot-matrix/${{ matrix.platform }}/
            .build/logs/snapshot-matrix-${{ matrix.platform }}-${{ matrix.name }}.log
            .build/logs/snapshot-matrix-${{ matrix.platform }}-${{ matrix.name }}-retry.log
          if-no-files-found: warn
          # A rerun of a failed leg replaces its artifact.
          overwrite: true

  snapshot-matrix-pages:
    name: Snapshot matrix — pages
    # One review page per platform over the legs' captures, uploaded as `snapshot-matrix-ios` and
    # `snapshot-matrix-macos` as before the split (open index.html in it): `tools/apple/snapshot-matrix.sh merge
    # --expect` copies their images, joins their manifests in the registry's order and builds the page, which names at
    # its top any component no capture brought. It fails then, or when a capture failed (the page lists its problems);
    # each leg's own artifact keeps its page and log. It warns when a component's number of images differs from
    # IMAGES in `snapshot-components`. Both platforms in one job: one runner, one checkout.
    needs: [snapshot-components, snapshot-matrix]
    if: >-
      !cancelled() && needs.snapshot-components.result == 'success' && needs.snapshot-matrix.result != 'skipped'
    # The page builder is Swift with CoreGraphics, so a Mac with the pinned Xcode; a few minutes.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          # Each leg's artifact into a directory of its own name.
          pattern: snapshot-matrix-*
          path: ${{ runner.temp }}/captures
      - name: One page per platform
        env:
          COMPONENTS: ${{ needs.snapshot-components.outputs.components }}
          LEGS: ${{ needs.snapshot-components.outputs.legs }}
          IMAGES: ${{ needs.snapshot-components.outputs.images }}
        run: |
          set -euo pipefail
          status=0
          for platform in ios macos; do
            captures=()
            names="$(jq -r --arg platform "$platform" '.[] | select(.platform == $platform) | .name' <<< "$LEGS")"
            for name in $names; do
              captures+=("$RUNNER_TEMP/captures/snapshot-matrix-$platform-$name/snapshot-matrix/$platform")
            done
            out=".build/snapshot-matrix/$platform"
            tools/apple/snapshot-matrix.sh merge --expect "$(jq -r 'join(",")' <<< "$COMPONENTS")" "$out" \
              "${captures[@]}" || status=1
            # The images each component's manifest expects, against IMAGES, which packs the legs.
            [ -f "$out/matrix.json" ] || continue
            jq -r --arg platform "$platform" --argjson images "$IMAGES" '
              .components[]
              | {id: .component, count: ([.groups[].sheets[].images[][]] | length)}
              | select(.count != $images[.id][$platform])
              | "::warning title=Snapshot matrix legs::\(.id) has \(.count) \($platform) images, IMAGES in"
                + " .github/workflows/snapshot-matrix.yml says \($images[.id][$platform] // "nothing"); correct it there."
              ' "$out/matrix.json"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-ios
          path: .build/snapshot-matrix/ios/
          if-no-files-found: warn
          # A rerun of this job replaces its page.
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-macos
          path: .build/snapshot-matrix/macos/
          if-no-files-found: warn
          overwrite: true
