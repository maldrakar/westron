# TEMPORARY probe for #99, on the probe branch only (second probe, run 2): whether the natural state comes from SwiftUI's
# line-height cache keyed by font addresses. The font cache that lets fonts go places them by a hash Swift seeds anew
# in each process, so this runs many short processes rather than one long one: each lays out the text-field sheets
# about once WITHOUT the fix, with the trace of line-height lookups from its first layout on, for 25 minutes per VM.
name: Probe 99 cache
on:
  push:
    branches: [probe/snapshot-99-cache]
permissions:
  contents: read
jobs:
  probe:
    name: Probe ${{ matrix.vm }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Uptime
        run: date; uptime; sw_vers; sysctl -n hw.ncpu hw.memsize
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Short processes without the fix, traced
        timeout-minutes: 30
        run: |
          mkdir -p .build/probe
          end=$(( $(date +%s) + 1500 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i + 1))
            WESTRON_PROBE_NO_KEEP=1 WESTRON_PROBE_LOOP=8 \
              swift test --skip-build --filter ProbeLoopTests > ".build/probe/loop-$i.log" 2>&1 || true
            if grep -q "probe-dev" ".build/probe/loop-$i.log"; then
              echo "process $i: deviations"; grep -E "probe-dev" ".build/probe/loop-$i.log" | head -5
            else
              rm ".build/probe/loop-$i.log"
            fi
          done
          echo "$i processes"; echo "$i processes" > .build/probe/count.txt
          uptime
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: probe-cache-run2-${{ matrix.vm }}
          path: .build/probe
          if-no-files-found: warn
