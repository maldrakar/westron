# TEMPORARY probe for #99, on the probe branch only: lays out the macOS text-field sheets again and again on CI
# runners, in one long process each, as in run 44932481160 where two of three runners showed the state,
# with a trace of every size AppKit gives a text field, printed for each picture whose fields differ from its first.
name: Probe 99
on:
  push:
    branches: [probe/snapshot-99-fields]
permissions:
  contents: read
jobs:
  loop:
    name: Loop ${{ matrix.vm }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Uptime
        run: date; uptime
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Loop, layout only, one long process (trace on vm 1-3, none on vm 4)
        timeout-minutes: 15
        run: |
          mkdir -p .build/probe
          date; uptime
          trace=1; [ "${{ matrix.vm }}" = 4 ] && trace=0
          WESTRON_PROBE_TRACE=$trace WESTRON_PROBE_DRAW=0 WESTRON_PROBE_LOOP=540 \
            swift test --skip-build --filter ProbeLoopTests > .build/probe/loop.log 2>&1 || true
          grep "probe: end" .build/probe/loop.log || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: probe-trace-${{ matrix.vm }}
          path: .build/probe
