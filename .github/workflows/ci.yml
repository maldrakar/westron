name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (Swift on Linux)
    runs-on: ubuntu-24.04
    # On Linux on purpose: the tools must not depend on Apple (decisions/0009).
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: "Tools: build, test and every check in tools/check.sh"
        run: tools/check.sh

  apple:
    name: Apple — package and catalog
    # The same image and Xcode as the todo-app pilot (decisions/0008).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and Swift
        run: |
          source tools/apple/xcode-env.sh
          xcodebuild -version
          swift --version
      - name: Format
        run: tools/apple/check.sh format
      - name: Build and tests (macOS)
        run: tools/apple/check.sh package
      - name: Tools tests on macOS (the SwiftUI type list is not stale)
        run: |
          source tools/apple/xcode-env.sh
          swift test --package-path tools
      - name: Compile for iOS and watchOS
        run: tools/apple/check.sh platforms
      - name: Catalog and UI tests
        run: tools/apple/check.sh catalog

  audit-scope:
    name: Accessibility audit — scope
    # Whether this run needs the audit: always on a push to main; on a pull request only when it changes a path the
    # audit depends on (what the catalog renders, how it is built, how the audit runs). Generated Swift lives under
    # platforms/apple, so a change in tools/ alone does not count.
    runs-on: ubuntu-24.04
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a merge commit has a second parent; anything else fails the step, and the audit then runs.
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          # Without rename detection, a file moved out of a watched path is listed under its old path too.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          pattern='^(platforms/apple/|tokens/|spec/|tools/apple/|Package\.swift$|Package\.resolved$|\.xcode-version$|\.github/workflows/ci\.yml$)'
          if grep -E "$pattern" "$RUNNER_TEMP/changed.txt"; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed path the audit depends on."
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

  accessibility-audit:
    name: >-
      Accessibility audit — ${{ matrix.test }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    # Eight parallel jobs, each with its own catalog build, about two runner-hours in all: on every push to main, and on
    # a pull request only when audit-scope finds a changed path the audit depends on; otherwise they show as skipped.
    # If audit-scope fails, they run (fail open): only its "audit=false" skips them. When this `if:` is false, GitHub
    # reports one skipped check under the unexpanded matrix name, so the legs must never be required checks: a pull
    # request that skips them would wait for them forever.
    needs: audit-scope
    if: >-
      !cancelled() && (github.event_name == 'push' || needs.audit-scope.result != 'success'
      || needs.audit-scope.outputs.audit != 'false')
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      # One job per configuration of CatalogAccessibilityAuditTests, and the two slow ones split into shards of the
      # catalog's entries (WESTRON_ENTRY_SHARD=<i>/<n>, every n-th entry). With the Button entries (PR #66, head
      # 1c62267), the runner took over 36.6 min for testAccessibilityDynamicType (killed by the timeout) and 32.4 min
      # for testDefaultSettings, and 16–19 min for each of the other three, about 3 times a local Mac (627 s, 476 s and
      # 194–196 s on 2026-11-17). So three shards and two, about 13 and 16 min of tests each, plus the build.
      matrix:
        include:
          - test: testAccessibilityDynamicType
            shard: 1
            shards: 3
          - test: testAccessibilityDynamicType
            shard: 2
            shards: 3
          - test: testAccessibilityDynamicType
            shard: 3
            shards: 3
          - test: testDefaultSettings
            shard: 1
            shards: 2
          - test: testDefaultSettings
            shard: 2
            shards: 2
          - test: testIncreasedContrast
          - test: testDarkAppearance
          - test: testDarkIncreasedContrast
    # The slowest job with the margin for the pages still to come; a job that nears it gets another shard.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Audit (iOS)
        env:
          WESTRON_ENTRY_SHARD: ${{ matrix.shard && format('{0}/{1}', matrix.shard, matrix.shards) || '' }}
        run: tools/apple/check.sh a11y ios ${{ matrix.test }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: a11y-${{ matrix.test }}${{ matrix.shard && format('-shard{0}of{1}', matrix.shard, matrix.shards) || '' }}
          path: |
            .build/logs/a11y-*.log
            .build/xcode/results/a11y-*.xcresult
          if-no-files-found: ignore

  catalog-screenshots:
    name: Catalog screenshots
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: iOS, light theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance light
      - name: iOS, dark theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance dark
      - name: macOS
        run: tools/apple/catalog-screenshot.sh macos --entry environment --appearance light
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-screenshots
          path: |
            .build/screenshots/
            .build/logs/
          if-no-files-found: warn

  snapshot-matrix:
    name: Snapshot matrix
    # The owner's review surface for the second approval gate (#24): every combination of every contract in the four
    # themes, one `xcodebuild test` per platform, uploaded as the `snapshot-matrix` artifact (open index.html in each
    # platform's folder). Informational: it must never be a required check. It runs when the accessibility audit does
    # (audit-scope), in parallel with the other jobs. Its pages compare only with another CI artifact from the same
    # runner image (decisions/0008): download two and run `tools/apple/snapshot-matrix.sh compare`.
    needs: audit-scope
    if: >-
      !cancelled() && (github.event_name == 'push' || needs.audit-scope.result != 'success'
      || needs.audit-scope.outputs.audit != 'false')
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    # Locally about 4.5 min for iOS and 3.5 for macOS plus the builds; the runner is 2.2–3 times slower (decisions/0008).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: iOS
        run: tools/apple/snapshot-matrix.sh ios
      - name: macOS
        # Also after a failed iOS capture: each platform's page shows what went wrong.
        if: ${{ !cancelled() }}
        run: tools/apple/snapshot-matrix.sh macos
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix
          path: |
            .build/snapshot-matrix/
            .build/logs/snapshot-matrix-*.log
          if-no-files-found: warn
