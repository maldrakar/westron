name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (Swift on Linux)
    runs-on: ubuntu-24.04
    # On Linux on purpose: the tools must not depend on Apple (decisions/0009).
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build and test tools, the raw-values lint, generate --check
        run: tools/check.sh

  apple:
    name: Apple — package and catalog
    # The same image and Xcode as the todo-app pilot (decisions/0008).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and Swift
        run: |
          source tools/apple/xcode-env.sh
          xcodebuild -version
          swift --version
      - name: Format
        run: tools/apple/check.sh format
      - name: Build and tests (macOS)
        run: tools/apple/check.sh package
      - name: Tools tests on macOS (the SwiftUI type list is not stale)
        run: |
          source tools/apple/xcode-env.sh
          swift test --package-path tools
      - name: Compile for iOS and watchOS
        run: tools/apple/check.sh platforms
      - name: Catalog and UI tests
        run: tools/apple/check.sh catalog

  accessibility-audit:
    name: Accessibility audit — ${{ matrix.test }}
    # The full audit on every pull request: five parallel jobs, about 40 runner-minutes of tests plus a catalog build in
    # each. To run it on main only, remove the "#" in front of the next line.
    # if: github.event_name == 'push'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      # One job per configuration of CatalogAccessibilityAuditTests. On the runner (2026-11-17), 2.2–2.3 times slower
      # than a local Mac: testAccessibilityDynamicType 13.5 min, testDarkAppearance and testDarkIncreasedContrast 4 min
      # each; testDefaultSettings about 11 min (estimated from 290 s locally); one serial run passed 40 min.
      matrix:
        test:
          - testDefaultSettings
          - testAccessibilityDynamicType
          - testIncreasedContrast
          - testDarkAppearance
          - testDarkIncreasedContrast
    # The slowest configuration with the margin for the pages still to come (the Button entries add about 40 %).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Audit (iOS)
        run: tools/apple/check.sh a11y ios ${{ matrix.test }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: a11y-${{ matrix.test }}
          path: |
            .build/logs/a11y-*.log
            .build/xcode/results/a11y-*.xcresult
          if-no-files-found: ignore

  catalog-screenshots:
    name: Catalog screenshots
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: iOS, light theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance light
      - name: iOS, dark theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance dark
      - name: macOS
        run: tools/apple/catalog-screenshot.sh macos --entry environment --appearance light
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-screenshots
          path: |
            .build/screenshots/
            .build/logs/
          if-no-files-found: warn
