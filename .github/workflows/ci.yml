name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Capacity (2026-11-20, phase 3: 28 catalog entries). Every job below but the two on Linux (tools, audit-scope) runs
  # on a Mac (`xcode-27`), and at most 5 run at once on this repository (runs 44339047592, 44360219942, 44364265656
  # and 44386153527). Until 2026-11-19 every pull request and push to main also ran the full accessibility audit (10
  # legs) and the snapshot matrix (4 legs and a page job): 17 Mac jobs, about 6–7.7 runner-hours, 85–150 min. By the
  # owner's decision of 2026-11-20 the full audit runs once a night (accessibility-audit.yml). Since 2026-11-21 (#92)
  # the snapshot matrix is rendered in-process and checked against references in `snapshots`, which replaced the job
  # "Catalog screenshots" and the on-demand snapshot-matrix.yml. Per run now, estimated from the times in the job
  # comments:
  #   a pull request: apple (about 25 min) and snapshots (about 25), and when it changes a component, an audit of that
  #     component's entries (10.4 min and 5.6 min an entry: Button's five about 38 min, Rule's one about 16): 2–3 Mac
  #     jobs, up to about 1.5 runner-hours (one more job for each further 5 entries when it changes several
  #     components), as long as its slowest job when the runners are free;
  #   a push to main: apple and snapshots, about 50 runner-minutes.
  tools:
    name: Tools (Swift on Linux)
    runs-on: ubuntu-24.04
    # On Linux on purpose: the tools must not depend on Apple (decisions/0009).
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: "Tools: build, test and every check in tools/check.sh"
        run: tools/check.sh

  apple:
    name: Apple — package and catalog
    # The same image and Xcode as the todo-app pilot (decisions/0008).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and Swift
        run: |
          source tools/apple/xcode-env.sh
          xcodebuild -version
          swift --version
      - name: Format
        run: tools/apple/check.sh format
      - name: Build and tests (macOS)
        run: tools/apple/check.sh package
      - name: Package tests on the iOS simulator
        # The same unit tests through xcodebuild, where they take the iOS branches of the code (#73). This job's only
        # simulator; the jobs that boot one already run their own UI tests on it.
        run: tools/apple/check.sh package-ios
      - name: Tools tests on macOS (the SwiftUI type list is not stale)
        run: |
          source tools/apple/xcode-env.sh
          swift test --package-path tools
      - name: Compile for iOS and watchOS
        run: tools/apple/check.sh platforms
      - name: Catalog and UI tests
        run: tools/apple/check.sh catalog

  audit-scope:
    name: Accessibility audit — scope
    # Which catalog entries this pull request's audit covers: `tools/apple/audit-scope.sh` maps its changed paths to
    # the entries of the components they belong to (a component's WestronUI directory, its generated files, its catalog
    # page, its contract) and of the Foundations pages that share nothing with others. Shared paths (tokens, the shared
    # files of WestronUI, the catalog's host and shared pages, the audit test, tools/apple/, Package.swift, the
    # workflows) give nothing here: they touch every entry, and the nightly full audit (accessibility-audit.yml) covers
    # them on main after the merge; to audit them before, run it by hand on the branch (`gh workflow run
    # accessibility-audit.yml --ref <branch>`). A push to main is not audited here at all: the nightly run covers it.
    # If this job fails (no merge commit, a component the script cannot place), no audit runs and the failure shows.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      entries: ${{ steps.scope.outputs.entries }}
      legs: ${{ steps.scope.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Changed components
        id: scope
        run: |
          set -euo pipefail
          # Only a merge commit has a second parent.
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          # Without rename detection, a file moved out of a component is listed under its old path too.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          entries="$(tools/apple/audit-scope.sh < "$RUNNER_TEMP/changed.txt")"
          # At most 5 entries a leg (see accessibility-audit below); more are split into shards of the same size.
          count="$(tr ',' '\n' <<< "$entries" | sed '/^$/d' | wc -l | tr -d ' ')"
          shards=$(((count + 4) / 5))
          [ "$shards" -gt 0 ] || shards=1
          if [ "$shards" -gt 1 ]; then
            legs="$(jq -nc --argjson n "$shards" '[range(1; $n + 1) | {shard: "\(.)/\($n)", name: " (\(.)/\($n))", slug: "-shard\(.)of\($n)"}]')"
          else
            legs='[{"shard": "", "name": "", "slug": ""}]'
          fi
          echo "entries=$entries" | tee -a "$GITHUB_OUTPUT"
          echo "legs=$legs" | tee -a "$GITHUB_OUTPUT"
          [ -n "$entries" ] || echo "Nothing to audit on this pull request."

  accessibility-audit:
    name: Accessibility audit — changed components${{ matrix.name }}
    # The five configurations of CatalogAccessibilityAuditTests (`tools/apple/check.sh a11y ios`, one xcodebuild run)
    # for the entries audit-scope found, in one job, in shards only when they are more than 5. Skipped when there are
    # none, and on a push to main. When this `if:` is false, GitHub reports one skipped check under the unexpanded
    # matrix name, so this job must never be a required check: a pull request that skips it would wait for it forever.
    #
    # Timeout. Per entry on CI, with a margin (tools/apple/check.sh, a11y_retry_estimate): testDefaultSettings 90 s,
    # testAccessibilityDynamicType 130 s, each of the other three 38 s, 334 s in all; before the first entry the step
    # spends 6.5–17.1 min, mean 10.4 (the build, the simulator, the runner; accessibility-audit.yml). The largest
    # component, Button, has 5 entries, the most a leg takes: 5 × 334 s = 27.8 min of tests, so a leg ends by
    # 17.1 + 27.8 = 44.9 min without a retry. The worst usual retry, a stall (3 min) in the first entry of a test after
    # the mean 10.4 min, stops that test method and retries all its entries (90 s to start, then each): 10.4 + 27.8 +
    # 3 + 1.5 = 42.7 min, within a retry budget of 50 (WESTRON_A11Y_RETRY_BUDGET), which takes it after up to 17.7 min
    # before the first entry (17.1 seen). The job's timeout is 55, 5 min above the budget, as in the nightly legs: a
    # leg the timeout kills uploads no logs. A known limit: when the test runner fails to start (7 min in, as seen on
    # CI), all five tests are retried whole, one at a time, each estimated at half the budget (25 min), so the first two
    # are retried and the third is refused (about 28 + 25 > 50): the leg fails with its logs, where a nightly leg, with
    # one test, retries the same failure in full.
    needs: audit-scope
    if: ${{ needs.audit-scope.result == 'success' && needs.audit-scope.outputs.entries != '' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.audit-scope.outputs.legs) }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Audit (iOS)
        # check.sh audits once more, in a second xcodebuild run, the entries a stalled simulator failed or kept from
        # being audited, and never a run with a finding (#74); each retry shows as a warning on the run. Only the
        # entries left are retried, and only within a time budget of 50 of the job's 55 minutes; a whole test only
        # when the test runner failed to start.
        env:
          WESTRON_ENTRY: ${{ needs.audit-scope.outputs.entries }}
          WESTRON_ENTRY_SHARD: ${{ matrix.shard }}
          WESTRON_A11Y_RETRY_BUDGET: 50
        run: tools/apple/check.sh a11y ios
      # A leg that retried keeps its logs, the first run's and the retry's, even when the retry passed: the flakiness
      # stays visible. Logs only, a few MB; the result bundles go up with a failure below. Whether there is a retry's
      # log is a shell step's output: `hashFiles()` in the upload's `if:` hashes the whole workspace's matches and once
      # failed the leg after a passed audit, "couldn't finish within 120 seconds" (run 44364265656).
      - name: Retry logs
        id: retried
        if: ${{ !cancelled() }}
        run: |
          if ls .build/logs/a11y-*-retry-*.log > /dev/null 2>&1; then
            echo "logs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.retried.outputs.logs == 'true' }}
        with:
          name: a11y-retried-changed${{ matrix.slug }}
          path: .build/logs/a11y-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: a11y-changed${{ matrix.slug }}
          path: |
            .build/logs/a11y-*.log
            .build/xcode/results/a11y-*.xcresult
          if-no-files-found: ignore

  snapshots:
    name: Snapshot matrix — check against the references
    # Renders the snapshot matrix of both platforms in-process (tools/apple/snapshot-matrix.sh: the unit tests in
    # platforms/apple/Tests/WestronSnapshotTests, under `swift test` on macOS and hosted by the catalog app on the iOS
    # simulator) and compares it with the references in platforms/apple/Snapshots/, recorded on this runner image by
    # snapshot-references.yml (decisions/0008, the note of 2026-11-21). The outcome of each platform's check:
    #   - the same, within one level a channel: the step passes;
    #   - a picture changed, was added or removed, or the render failed: the job fails, and the artifact
    #     `snapshot-diff` holds the report (index.html: reference, new picture and diff side by side, the changed
    #     components named). An intended change is recorded with the label `record-snapshots` on the pull request;
    #   - no references yet, or references recorded on another runner image (its macOS, processor, Xcode or simulator
    #     runtime differ from those in environment.json): nothing can be compared, so the step passes with a warning
    #     on the run that the references need recording: a pull request does not fail for what the runner image did.
    #     Until they are recorded again on main, no pull request is checked, so record them soon.
    # Every run uploads the full review page of each platform, `snapshot-matrix` (the second gate's surface,
    # decisions/0005): about 77 MB of PNGs (60 iOS, 17 macOS, measured locally), kept 14 days.
    #
    # The references are in Git LFS. The checkout leaves them as pointers (`.lfsconfig` excludes them), and the
    # renders do not need them; before the check they come from the cache of `.git/lfs`, keyed by their object ids, and
    # `git lfs pull` fetches only what the cache lacks, so an unchanged set costs no LFS bandwidth (a cache made on
    # main serves pull requests; GitHub counts Actions downloads against the owner's 10 GiB a month).
    #
    # Timeout. On this runner (the spike of 2026-11-20, #92): the macOS test build 79 s and the render 207–237 s for
    # 196 images; the simulator 85 s, the catalog build 432 s and the render 325–336 s for 388 images, 406–490 s of
    # xcodebuild in all. About 22 min with the checkout, the LFS pull, the comparison and the uploads. The renders have
    # step timeouts of their own with room for the retries of blank iOS pictures (up to four renders of a 13–17 s
    # sheet), so a hung step still leaves time for the uploads; the job's 50 min cover the rest.
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Render (macOS)
        timeout-minutes: 15
        run: tools/apple/snapshot-matrix.sh macos
      - name: Render (iOS)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: tools/apple/snapshot-matrix.sh ios
      - name: Reference object ids
        if: ${{ !cancelled() }}
        run: |
          git lfs install --local
          mkdir -p .build
          git lfs ls-files --long --include 'platforms/apple/Snapshots/**' --exclude '' | cut -d' ' -f1 | sort \
            > .build/snapshot-references.lfs-ids
          echo "$(wc -l < .build/snapshot-references.lfs-ids | tr -d ' ') reference objects"
      - uses: actions/cache@v6
        if: ${{ !cancelled() }}
        with:
          path: .git/lfs
          key: snapshot-references-${{ hashFiles('.build/snapshot-references.lfs-ids') }}
          restore-keys: snapshot-references-
      - name: References from Git LFS
        if: ${{ !cancelled() }}
        run: git lfs pull --include 'platforms/apple/Snapshots/**' --exclude ''
      - name: Check against the references
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          for platform in macos ios; do
            if [ ! -f ".build/snapshot-matrix/$platform/environment.json" ]; then
              echo "::error title=Snapshot matrix ($platform)::The render failed before its manifest; see the step above and the logs."
              failed=1
              continue
            fi
            status=0
            tools/apple/snapshot-matrix.sh check "$platform" --from ".build/snapshot-matrix/$platform" || status=$?
            case "$status" in
              0) ;;
              3) echo "::warning title=No snapshot references ($platform)::Nothing to compare with yet. Record them: the label record-snapshots on a pull request, or gh workflow run snapshot-references.yml --ref <branch>." ;;
              4) echo "::warning title=Snapshot references from another environment ($platform)::The runner image differs from the one the references were recorded on (the step's output lists what), so nothing was compared. Record them again: the label record-snapshots on a pull request, or gh workflow run snapshot-references.yml --ref main -f allow-main=true." ;;
              *)
                echo "::error title=Snapshot matrix ($platform)::The render differs from the references (or failed); the artifact snapshot-diff holds the report."
                failed=1
                ;;
            esac
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix
          path: |
            .build/snapshot-matrix/ios/
            .build/snapshot-matrix/macos/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapshot-diff
          path: |
            .build/snapshot-matrix/check-ios/
            .build/snapshot-matrix/check-macos/
            .build/logs/
          if-no-files-found: ignore
