name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Capacity (2026-11-19, phase 3 with Text field: 28 catalog entries, 364 iOS and 184 macOS snapshot images). Every
  # job below but the three on Linux (tools, audit-scope, snapshot-components) runs on a Mac (`xcode-27`), at most 5
  # at once on this repository, so a run's wall-clock is about its Mac runner-minutes over 5 (runs 44360219942 and
  # 44386153527: 13 Mac jobs, 62–69 min). Per run, from the times in the job comments (apple about 25 min,
  # catalog-screenshots about 20, a page merge about 3):
  #   before: 35 Mac jobs (audit 17 legs, snapshot 14 + 2 pages), about 10.1 runner-hours, about 2 h on 5 runners;
  #   now:    17 Mac jobs (audit 10 legs, snapshot 4 + 1 pages), about 7.7 runner-hours, about 1.5 h on 5 runners.
  # What is left is mostly the audit's own tests (2.6 h) and the captures (1.9 h); each Mac job's build and setup
  # costs 5–17 min more.
  tools:
    name: Tools (Swift on Linux)
    runs-on: ubuntu-24.04
    # On Linux on purpose: the tools must not depend on Apple (decisions/0009).
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: "Tools: build, test and every check in tools/check.sh"
        run: tools/check.sh

  apple:
    name: Apple — package and catalog
    # The same image and Xcode as the todo-app pilot (decisions/0008).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and Swift
        run: |
          source tools/apple/xcode-env.sh
          xcodebuild -version
          swift --version
      - name: Format
        run: tools/apple/check.sh format
      - name: Build and tests (macOS)
        run: tools/apple/check.sh package
      - name: Package tests on the iOS simulator
        # The same unit tests through xcodebuild, where they take the iOS branches of the code (#73). This job's only
        # simulator; the jobs that boot one already run their own UI tests on it.
        run: tools/apple/check.sh package-ios
      - name: Tools tests on macOS (the SwiftUI type list is not stale)
        run: |
          source tools/apple/xcode-env.sh
          swift test --package-path tools
      - name: Compile for iOS and watchOS
        run: tools/apple/check.sh platforms
      - name: Catalog and UI tests
        run: tools/apple/check.sh catalog

  audit-scope:
    name: Accessibility audit — scope
    # Whether this run needs the audit: always on a push to main; on a pull request only when it changes a path the
    # audit depends on (what the catalog renders, how it is built, how the audit runs). Generated Swift lives under
    # platforms/apple, so a change in tools/ alone does not count.
    runs-on: ubuntu-24.04
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a merge commit has a second parent; anything else fails the step, and the audit then runs.
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          # Without rename detection, a file moved out of a watched path is listed under its old path too.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          pattern='^(platforms/apple/|tokens/|spec/|tools/apple/|Package\.swift$|Package\.resolved$|\.xcode-version$|\.github/workflows/ci\.yml$)'
          if grep -E "$pattern" "$RUNNER_TEMP/changed.txt"; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed path the audit depends on."
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

  accessibility-audit:
    name: >-
      Accessibility audit — ${{ matrix.test }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    # Ten parallel jobs, each with its own catalog build, about 4.3 runner-hours in all: on every push to main, and on a
    # pull request only when audit-scope finds a changed path the audit depends on; otherwise they show as skipped.
    # If audit-scope fails, they run (fail open): only its "audit=false" skips them. When this `if:` is false, GitHub
    # reports one skipped check under the unexpanded matrix name, so the legs must never be required checks: a pull
    # request that skips them would wait for them forever.
    needs: audit-scope
    if: >-
      !cancelled() && (github.event_name == 'push' || needs.audit-scope.result != 'success'
      || needs.audit-scope.outputs.audit != 'false')
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      # Each configuration of CatalogAccessibilityAuditTests, the slow two split into shards of the catalog's entries
      # (WESTRON_ENTRY_SHARD=<i>/<n>, every n-th entry from the i-th). With the Button entries (PR #66, head 1c62267),
      # the runner took over 36.6 min for testAccessibilityDynamicType (killed by the timeout) and 32.4 min for
      # testDefaultSettings, and 16–19 min for each of the other three, about 3 times a local Mac (627 s, 476 s and
      # 194–196 s on 2026-11-17). Phase 3 grows the catalog from 17 entries (ded3d5c) to 28 with Text field's four.
      # Per entry on CI, with a margin (tools/apple/check.sh, a11y_retry_estimate): testDefaultSettings 90 s,
      # testAccessibilityDynamicType 130 s, the other three 38 s; before the first entry the step spends 6.5–17.1 min,
      # mean 10.4 (the build, the simulator, the runner), paid once per leg. So fewer, longer legs, under 45 min each
      # with a retry budget of 40 (tools/apple/check.sh):
      #   testDefaultSettings           28 × 90 s = 42.0 min → 3 shards of at most 10 entries: 15.0 + 10.4 = 25.4 min
      #   testAccessibilityDynamicType  28 × 130 s = 60.7 min → 4 shards of at most 7 entries: 15.2 + 10.4 = 25.6 min
      #   each of the other three       28 × 38 s = 17.7 min → 1 leg of 28 entries:           17.7 + 10.4 = 28.1 min
      # The worst usual retry, a stall (3 min) in the first entry of a leg after the mean 10.4 min, retries all its
      # entries (90 s to start, then each): a contrast leg ends at 10.4 + 3 + 1.5 + 17.7 = 32.6 min, within the budget
      # of 40, which takes it after up to 17.8 min before the first entry (17.1 seen); testAccessibilityDynamicType
      # 30.1, testDefaultSettings 29.9. Without a retry the slowest leg ends by 17.1 + 17.7 = 34.8 min. With 17 legs
      # of 35 min the same retry fitted only after up to 14.7 min. A leg past about 30 min as pages are added (a
      # contrast leg at about 31 entries) gets another shard.
      matrix:
        include:
          - {test: testDefaultSettings, shard: 1, shards: 3}
          - {test: testDefaultSettings, shard: 2, shards: 3}
          - {test: testDefaultSettings, shard: 3, shards: 3}
          - {test: testAccessibilityDynamicType, shard: 1, shards: 4}
          - {test: testAccessibilityDynamicType, shard: 2, shards: 4}
          - {test: testAccessibilityDynamicType, shard: 3, shards: 4}
          - {test: testAccessibilityDynamicType, shard: 4, shards: 4}
          - {test: testIncreasedContrast}
          - {test: testDarkAppearance}
          - {test: testDarkIncreasedContrast}
    # The retry's budget in tools/apple/check.sh is 40 of these 45 min: a leg the timeout kills uploads no logs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Audit (iOS)
        # check.sh audits once more, in a second xcodebuild run, the entries a stalled simulator failed or kept from
        # being audited, and never a run with a finding (#74); each retry shows as a warning on the run. Only the
        # entries left are retried, and only within a time budget of 40 of the job's 45 minutes; the whole shard only
        # when the test runner failed to start.
        env:
          WESTRON_ENTRY_SHARD: ${{ matrix.shard && format('{0}/{1}', matrix.shard, matrix.shards) || '' }}
        run: tools/apple/check.sh a11y ios ${{ matrix.test }}
      # A leg that retried keeps its logs, the first run's and the retry's, even when the retry passed: the flakiness
      # stays visible. Logs only, a few MB; the result bundles go up with a failure below. Whether there is a retry's
      # log is a shell step's output: `hashFiles()` in the upload's `if:` hashes the whole workspace's matches and once
      # failed the leg after a passed audit, "couldn't finish within 120 seconds" (run 44364265656).
      - name: Retry logs
        id: retried
        if: ${{ !cancelled() }}
        run: |
          if ls .build/logs/a11y-*-retry-*.log > /dev/null 2>&1; then
            echo "logs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.retried.outputs.logs == 'true' }}
        with:
          name: a11y-retried-${{ matrix.test }}${{ matrix.shard && format('-shard{0}of{1}', matrix.shard, matrix.shards) || '' }}
          path: .build/logs/a11y-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: a11y-${{ matrix.test }}${{ matrix.shard && format('-shard{0}of{1}', matrix.shard, matrix.shards) || '' }}
          path: |
            .build/logs/a11y-*.log
            .build/xcode/results/a11y-*.xcresult
          if-no-files-found: ignore

  catalog-screenshots:
    name: Catalog screenshots
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: iOS, light theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance light
      - name: iOS, dark theme
        run: tools/apple/catalog-screenshot.sh ios --entry environment --appearance dark
      - name: macOS
        run: tools/apple/catalog-screenshot.sh macos --entry environment --appearance light
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-screenshots
          path: |
            .build/screenshots/
            .build/logs/
          if-no-files-found: warn

  snapshot-components:
    name: Snapshot matrix — legs
    # The components the snapshot matrix captures and the legs that capture them. The components are the members of the
    # generated registry `ComponentMatrix.all` (WestronCatalog/Generated/ComponentMatrix+All.swift), which
    # `tools/westron generate` writes for every contract that gives API on Apple and the tools job holds to the
    # contracts (`generate --check`); its members are the contracts' ids in lowerCamelCase (`textField` for
    # `text-field`).
    #
    # The legs pack the components by their images, so that each platform takes few jobs, each with its own build:
    # first fit, the largest first, into legs of at most 40 min of capture on the runner, at 15 s an iOS image and 8 s a
    # macOS one (on CI, Button's 144 iOS images took 30–42 min and its 72 macOS ones 10–11, builds included: runs
    # 44360219942 and 44386153527). The number of images per component is not cheap to compute from the sources (the
    # supplements and the parts at accessibility5 are the catalog's Swift), so IMAGES below holds it, counted from the
    # captures' manifests (`jq '[.components[] | {(.component): ([.groups[].sheets[].images[][]] | length)}] | add'
    # matrix.json`); `snapshot-matrix-pages` warns when a capture's count differs from it. A component missing from
    # IMAGES gets 150 iOS and 150 macOS images, about a leg of its own, and a warning: add its counts then.
    # Each leg's timeout: 20 min for the build and the simulator (6.5–17.1 min on CI) and its capture time with a
    # third more.
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.legs.outputs.components }}
      legs: ${{ steps.legs.outputs.legs }}
      images: ${{ steps.legs.outputs.images }}
    env:
      IMAGES: >-
        {"button": {"ios": 144, "macos": 72}, "checkbox": {"ios": 18, "macos": 12}, "icon": {"ios": 73, "macos": 32},
        "rule": {"ios": 7, "macos": 4}, "surface": {"ios": 24, "macos": 12}, "text": {"ios": 47, "macos": 24},
        "text-field": {"ios": 51, "macos": 28}}
    steps:
      - uses: actions/checkout@v7
      - name: Components and legs
        id: legs
        run: |
          set -euo pipefail
          registry=platforms/apple/Sources/WestronCatalog/Generated/ComponentMatrix+All.swift
          components="$(sed -n '/static let all: \[ComponentMatrix\]/,$p' "$registry" | grep -oE '\.[A-Za-z0-9]+' \
            | sed 's/^\.//' | perl -pe 's/([A-Z])/-\l$1/g' | jq -R . | jq -cs .)"
          if [ "$components" = "[]" ]; then
            echo "No component in $registry" >&2
            exit 1
          fi
          for id in $(jq -r --argjson images "$IMAGES" '.[] | select($images[.] == null)' <<< "$components"); do
            echo "::warning title=Snapshot matrix legs::No image count for $id in IMAGES" \
              "(.github/workflows/ci.yml); it is packed as 150 images."
          done
          legs="$(jq -c --argjson images "$IMAGES" '
            . as $ids
            | [ ("ios", "macos") as $platform
              | {ios: 15, macos: 8}[$platform] as $per
              | [ $ids[] | {id: ., images: ($images[.][$platform] // 150)} | .seconds = .images * $per ]
              | sort_by(-.seconds)
              | reduce .[] as $c ([];
                  (map(.seconds + $c.seconds <= 2400) | index(true)) as $i
                  | if $i == null then . + [{ids: [$c.id], images: $c.images, seconds: $c.seconds}]
                    else .[$i].ids += [$c.id] | .[$i].images += $c.images | .[$i].seconds += $c.seconds end)
              | .[]
              | (.ids | sort_by(. as $id | $ids | index($id))) as $ordered
              | {platform: $platform, components: ($ordered | join(",")), name: ($ordered | join("+")),
                 images: .images, timeout: (20 + (.seconds * 4 / 3 / 60 | ceil))} ]' <<< "$components")"
          echo "components=$components" | tee -a "$GITHUB_OUTPUT"
          echo "legs=$legs" | tee -a "$GITHUB_OUTPUT"
          echo "images=$(jq -c . <<< "$IMAGES")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.platform): \(.name), \(.images) images, \(.timeout) min"' <<< "$legs"

  snapshot-matrix:
    name: Snapshot matrix (${{ matrix.platform }}, ${{ matrix.name }})
    # The owner's review surface for the second approval gate (#24, #72): every combination of every contract in the
    # four themes, on iOS also at the smallest and the largest text size, with the catalog's supplementary sheets. One
    # job per leg of `snapshot-components` (its components in one `xcodebuild test`, `--component a,b`), side by side,
    # each uploaded as `snapshot-matrix-<platform>-<components joined with +>`; `snapshot-matrix-pages` below puts them
    # into one page per platform. Informational: it must never be a required check. It runs when the accessibility
    # audit does (audit-scope), in parallel with the other jobs. Its pages compare only with another CI artifact from
    # the same runner image (decisions/0008): download two and run `tools/apple/snapshot-matrix.sh compare`.
    needs: [audit-scope, snapshot-components]
    if: >-
      !cancelled() && needs.snapshot-components.result == 'success' && (github.event_name == 'push'
      || needs.audit-scope.result != 'success' || needs.audit-scope.outputs.audit != 'false')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.snapshot-components.outputs.legs) }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture
        run: tools/apple/snapshot-matrix.sh ${{ matrix.platform }} --component ${{ matrix.components }}
      - uses: actions/upload-artifact@v7
        # Also after a failed capture: the page shows what went wrong.
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-${{ matrix.platform }}-${{ matrix.name }}
          path: |
            .build/snapshot-matrix/${{ matrix.platform }}/
            .build/logs/snapshot-matrix-${{ matrix.platform }}-${{ matrix.name }}.log
          if-no-files-found: warn

  snapshot-matrix-pages:
    name: Snapshot matrix — pages
    # One review page per platform over the legs' captures, uploaded as `snapshot-matrix-ios` and
    # `snapshot-matrix-macos` as before the split (open index.html in it): `tools/apple/snapshot-matrix.sh merge
    # --expect` copies their images, joins their manifests in the registry's order and builds the page, which names at
    # its top any component no capture brought. It fails then, or when a capture failed (the page lists its problems);
    # each leg's own artifact keeps its page and log. It warns when a component's number of images differs from
    # IMAGES in `snapshot-components`. Both platforms in one job: one runner, one checkout. Informational: never a
    # required check.
    needs: [snapshot-components, snapshot-matrix]
    if: >-
      !cancelled() && needs.snapshot-components.result == 'success' && needs.snapshot-matrix.result != 'skipped'
    # The page builder is Swift with CoreGraphics, so a Mac with the pinned Xcode; a few minutes.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          # Each leg's artifact into a directory of its own name.
          pattern: snapshot-matrix-*
          path: ${{ runner.temp }}/captures
      - name: One page per platform
        env:
          COMPONENTS: ${{ needs.snapshot-components.outputs.components }}
          LEGS: ${{ needs.snapshot-components.outputs.legs }}
          IMAGES: ${{ needs.snapshot-components.outputs.images }}
        run: |
          set -euo pipefail
          status=0
          for platform in ios macos; do
            captures=()
            names="$(jq -r --arg platform "$platform" '.[] | select(.platform == $platform) | .name' <<< "$LEGS")"
            for name in $names; do
              captures+=("$RUNNER_TEMP/captures/snapshot-matrix-$platform-$name/snapshot-matrix/$platform")
            done
            out=".build/snapshot-matrix/$platform"
            tools/apple/snapshot-matrix.sh merge --expect "$(jq -r 'join(",")' <<< "$COMPONENTS")" "$out" \
              "${captures[@]}" || status=1
            # The images each component's manifest expects, against IMAGES, which packs the legs.
            [ -f "$out/matrix.json" ] || continue
            jq -r --arg platform "$platform" --argjson images "$IMAGES" '
              .components[]
              | {id: .component, count: ([.groups[].sheets[].images[][]] | length)}
              | select(.count != $images[.id][$platform])
              | "::warning title=Snapshot matrix legs::\(.id) has \(.count) \($platform) images, IMAGES in"
                + " .github/workflows/ci.yml says \($images[.id][$platform] // "nothing"); correct it there."
              ' "$out/matrix.json"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-ios
          path: .build/snapshot-matrix/ios/
          if-no-files-found: warn
          # A rerun of this job replaces its page.
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: snapshot-matrix-macos
          path: .build/snapshot-matrix/macos/
          if-no-files-found: warn
          overwrite: true
