# westron's IconTile contract (#118), a draft for the first gate: decisions/0001-icon-tile-contract.md records the
# owner's decision to keep the tile a component (2026-11-22, decisions/0014), what the documents already decide, what
# the agent answered from the sources with no interview, and the open questions for the approver, each with the
# agent's recommendation. Nothing is generated while it is a draft.
id: icon-tile
status: draft
description: >-
  A list's mark: a rounded square in the list's color with the list's glyph on it, which stands beside a list's title
  in a row, a screen header, a picker and the card a drag carries, and alone above the words of an empty screen. Its
  color comes from the context, as the checked Checkbox's does: with a list's color in its context the tile is
  color.category.<name>.background and its glyph color.category.<name>.icon, for each of the twelve list colors, the
  glyph meeting 3:1 on the tile in the standard themes and 4.5:1 in high contrast (the declared non-text pairs of
  decisions/0012). With no list color in its context the tile is neutral, color.background.muted with its glyph in
  color.text.secondary, the colors of a tag or a badge without a color; it never takes the accent, which marks the
  primary action and the selection, not a thing a person named (design-language/00, principle 3). The bindings below
  are the neutral tile's, since the list's color is the context's and not an option of the contract; this text is the
  contract for a list's color. The tile is a quiet ground with a colored glyph, not a solid fill, so a column of lists
  stays calm and the tile is never read as a checked check, which is a disc filled with the list's control color. It
  draws no line in any theme: the glyph carries the tile's meaning, and the high-contrast themes darken it on the
  same ground. The tile has no size of its own: it is sized by the text role of its context, as an icon and the check
  are, and grows with the person's text size; its side is a fixed proportion of that role's line height, about one
  and a half lines, and the glyph a fixed proportion of the side, about six tenths, in the role's weight, both set at
  implementation from the pilot's and reviewed in the snapshot matrix (design-language/07, "Inside a shape, an icon is
  sized by the shape"). Where it must be smaller or larger than its text, it takes the platform's relative scale, as
  an icon does. Its corner is a quarter of its side, westron's ratio of a corner to a height (design-language/04),
  and scales with it: an off-ladder corner that belongs to this component, so no radius token is bound; continuous on
  Apple, circular elsewhere. The bindings below cannot say the side, the glyph's size or the corner, so this text is
  the contract for them, as Checkbox's is for its diameter. It has no states and no motion: a row that cannot be
  chosen dims the tile with the rest of the row.
consumers: [todo-app/lists-screen, todo-app/list-screen]

options:
  glyph:
    type: icons
    description: >-
      No default: every use names its glyph, the list's icon as the product stores it. The values are the names of the
      icon registry, spec/icons/icons.yaml, in its order, as Icon's are; a name this version does not know draws the
      registry's default, bullets.
  scale:
    type: enum
    values: [small, medium, large]
    default: medium
    description: >-
      The platform's relative scale against the text role the tile takes its size from: medium is the role's own
      tile. It scales the tile and its glyph together, so the glyph keeps its proportion to the tile. It is never a
      size in points (design-language/07, "A relative scale is the only size choice").

slots: [label]

tokens:
  tile.background: color.background.muted
  glyph.color: color.text.secondary

accessibility:
  role: image
  label: optional
  description: >-
    A tile without a label is decorative and hidden from assistive technology, as an icon without one is: beside its
    list's title, in a row, a header, a picker or an empty screen's title, it would only repeat it, and neither the
    system's name for the glyph nor the color name says what the list is. A tile that stands without its list's name
    is made with a label, the list's name, and is announced as an image with that label. Color is never the only
    signal of a list: it has a glyph and a name too (design-language/02, 08).

platforms:
  apple:
    strategy: own-component
    form: view
    systemOptions: { scale: SwiftUI.Image.Scale }
    description: >-
      IconTile(.tray) draws a decorative tile, hidden from assistive technology; IconTile(.folder, label: list.title)
      is announced as an image labeled with the list's name, with a localized twin, IconTile(.sun, label: "Today"),
      as Icon takes its label. The list's color reaches it through the environment, from the shared .category(_:)
      modifier Checkbox reads (spec/conventions.md, "Context a style reads"): set once around a list's rows or a
      screen, .category(Westron.Category(rawValue: list.color)), the closest one winning; nil, the default, is the
      neutral tile, IconTile's own default under conventions' "nil being the contract's default", where a checked
      check draws the accent. IconTile adds no modifier and no initializer argument for the color. The glyph is the
      registry's SF Symbol, drawn monochrome in the glyph color, whatever foregroundStyle the context sets. The side
      follows the line height of the font in the environment, measured from a hidden line of text as Checkbox
      measures its circle's, so the tile follows .textRole(_:) and Dynamic Type; scale is SwiftUI's own Image.Scale,
      which the product sets with .imageScale(_:) on the tile or its container, so IconTile takes no scale argument
      and no enum is generated. Inside ContentUnavailableView, the empty screen's system view (decisions/0014), the
      tile stands in the label's icon and takes the font and scale the system gives that icon; the size that gives is
      measured at implementation. The shape is a continuous rounded rectangle. The name is no SwiftUI type (checked
      against tools/Sources/WestronTools/Contracts/SwiftUITypes.swift, Xcode 27.1); SwiftUI has no tile, so westron
      builds its own view, as it does Icon (decisions/0003, point 2).
    watchos:
      description: >-
        Drawn as on the other OSes, always in the dark themes; nothing restricted, since an own component takes no
        restriction yet. What a list's tile is on the watch is part of the watchOS subset, decided separately (#34).
  web:
    status: planned
    description: >-
      Provisional until phase 6 (#40): an element holding westron's inline SVG glyph, sized in em from the line height
      of its context and drawn with westron's CSS, the list's color from a custom property or a class on an ancestor
      (spec/conventions.md, "Context a style reads"); hidden with aria-hidden, or role="img" with aria-label when it
      has a label. Corners are circular.
  linux:
    status: planned
    description: >-
      Provisional until phase 7: a box with westron's style class around a stock GtkImage with a symbolic icon, the
      list's color from a style class on an ancestor; its accessible role and label as on the web. Corners are
      circular.
  android:
    status: planned
