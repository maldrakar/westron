# westron's IconTile contract (#118), approved on 2026-11-22 by the coordinating agent under the owner's delegation of
# that day (decisions/0014, "Process"): decisions/0001-icon-tile-contract.md records the owner's decision to keep the
# tile a component, what the documents already decide, what the agent answered from the sources with no interview,
# and the approver's answers. The fill of a list's color, question 3, the owner settled on 2026-11-22: the solid fill
# that design-language/02 names.
id: icon-tile
status: approved
description: >-
  A list's mark: a rounded square in the list's color with the list's glyph on it, which stands beside a list's title
  in a row, a screen header, a picker and the card a drag carries, and alone above the words of an empty screen. Its
  color comes from the context, as the checked Checkbox's does: with a list's color in its context the tile is
  color.category.<name>.fill and its glyph color.category.<name>.on-fill, for each of the twelve list colors, the
  glyph meeting the text contrast on the fill, 4.5:1 and 7:1 in high contrast (the declared pairs of decisions/0012);
  tags, tiles and statuses keep fill, which is not held to the non-text contrast on the ground, since the glyph and
  the list's name carry the meaning (design-language/02; the owner's choice, decisions/0001, question 3). With no list
  color in its context the tile is
  neutral, color.background.muted with its glyph in color.text.secondary, the colors of a tag or a badge without a
  color; it never takes the accent, which marks the primary action and the selection, not a thing a person named
  (design-language/00, principle 3). The bindings below are the neutral tile's, since the list's color is the
  context's and not an option of the contract; this text is the contract for a list's color. It is a rounded square,
  not a circle, so a solid tile is not read as a checked check, a disc in the list's control color. It draws no line
  in any theme: the glyph carries the tile's meaning, and its color pair holds in high contrast on the same ground.
  The tile has no size of its own: it is sized by the text role of its context, as an icon and the check are, and
  grows with the person's text size. Its side is 1.5 times the line height of that role; its glyph is fitted into a
  square of 0.6 of the side, in the role's weight; its corner is a quarter of the side, westron's ratio of a corner to
  a height (design-language/04), and scales with it: an off-ladder corner that belongs to this component, so no
  radius token is bound; continuous on Apple, circular elsewhere (design-language/07, "Inside a shape, an icon is
  sized by the shape"). Where it must be smaller or larger than its text, it takes the platform's relative scale,
  which scales the tile and its glyph together by the steps the platform scales a symbol by. The bindings below cannot
  say the side, the glyph's size or the corner, so this text is the contract for them, as Checkbox's is for its
  diameter. It has no states and no motion: a row that cannot be chosen dims the tile with the rest of the row.
consumers: [todo-app/lists-screen, todo-app/list-screen]

options:
  glyph:
    type: icons
    description: >-
      No default: every use names its glyph, the list's icon as the product stores it. The values are the names of the
      icon registry, spec/icons/icons.yaml, in its order, as Icon's are; a name this version does not know draws the
      registry's default, bullets.
  scale:
    type: enum
    values: [small, medium, large]
    default: medium
    description: >-
      The platform's relative scale against the text role the tile takes its size from: medium is the role's own
      tile. It scales the tile and its glyph together, so the glyph keeps its proportion to the tile. It is never a
      size in points (design-language/07, "A relative scale is the only size choice").

slots: [label]

reads:
  category:
    description: >-
      In a list's color, the tile is filled with the list's color and its glyph drawn in the color that reads on it.
    unset: >-
      the tile is neutral, in the quiet gray fill of a tag without a color with its glyph in the secondary ink, and
      never takes the accent.

tokens:
  tile.background: color.background.muted
  glyph.color: color.text.secondary

accessibility:
  role: image
  label: optional
  description: >-
    A tile without a label is decorative and hidden from assistive technology, as an icon without one is: beside its
    list's title, in a row, a header, a picker or an empty screen's title, it would only repeat it, and neither the
    system's name for the glyph nor the color name says what the list is. A tile that stands without its list's name
    is made with a label, the list's name, and is announced as an image with that label. Color is never the only
    signal of a list: it has a glyph and a name too (design-language/02, 08).

platforms:
  apple:
    strategy: own-component
    form: view
    systemOptions: { scale: SwiftUI.Image.Scale }
    description: >-
      IconTile(.tray) draws a decorative tile, hidden from assistive technology; IconTile(.folder, label: list.title)
      is one element announced as an image labeled with the list's name, with a localized twin, IconTile(.sun, label:
      "Today"), as Icon takes its label. An empty label that is not localized, a list's title not given yet, is no
      label: the tile is decorative and hidden. The list's color reaches it through the environment, from the shared
      .category(_:) modifier Checkbox reads (spec/conventions.md, "Context a style reads"): set once around a list's
      rows or a screen, .category(Westron.Category(rawValue: list.color)), the closest one winning; nil, the default,
      is the neutral tile, IconTile's own default under the conventions' "nil being the contract's default", where a
      checked check draws the accent. IconTile adds no modifier and no initializer argument for the color. The glyph
      is the registry's SF Symbol, resizable and fitted into its square, drawn monochrome in the glyph color, whatever
      foregroundStyle the context sets; a resizable symbol keeps the weight of the font in the environment. The side
      follows the line height of the font in the environment, measured on a hidden line of text as Checkbox measures
      its circle, so the tile follows .textRole(_:) and Dynamic Type; scale is SwiftUI's own Image.Scale, which the
      product sets with .imageScale(_:) on the tile or its container, and the tile takes the step from the ratio of
      one reference symbol's height at that scale to its height at medium, the same symbol for every tile so that
      tiles of different glyphs in a column keep one side, measured on two hidden symbols, so IconTile takes no
      scale argument and no enum is generated. The tile's text baseline is that of the hidden line centered in it, so
      in a row aligned on the first text baseline its center sits on the middle of the title's first line. Inside
      ContentUnavailableView, the empty screen's system view (decisions/0014), the tile stands in the label's icon and
      takes the font the system gives that icon. The shape is a continuous rounded rectangle. The name is no SwiftUI
      type (tools/Sources/WestronTools/Contracts/SwiftUITypes.swift, Xcode 27.1); SwiftUI has no tile, so westron
      builds its own view, as it does Icon (decisions/0003, point 2).
    watchos:
      description: >-
        Drawn as on the other OSes, always in the dark themes; nothing restricted, since an own component takes no
        restriction yet. What a list's tile is on the watch is part of the watchOS subset, decided separately (#34).
  web:
    status: planned
    description: >-
      Provisional until phase 6 (#40): an element holding westron's inline SVG glyph, sized in em from the line height
      of its context and drawn with westron's CSS, the list's color from a custom property or a class on an ancestor
      (spec/conventions.md, "Context a style reads"); hidden with aria-hidden, or role="img" with aria-label when it
      has a label. Corners are circular.
  linux:
    status: planned
    description: >-
      Provisional until phase 7: a box with westron's style class around a stock GtkImage with a symbolic icon, the
      list's color from a style class on an ancestor; its accessible role and label as on the web. Corners are
      circular.
  android:
    status: planned
