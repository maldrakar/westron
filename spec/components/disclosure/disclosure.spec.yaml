# westron's Disclosure contract (#120), a draft for the coordinating agent's approval under the owner's delegation
# (decisions/0014, "Process"). decisions/0001-disclosure-contract.md records what the documents and the pilot decide,
# what the agent proposes on top of them, the open questions with a recommendation each (this draft is written to the
# recommendations), how the pilot composes its tree branch and its block header, and what the tools lack: the Apple
# entry below is `planned` only because `spec check` does not know SwiftUI.DisclosureGroup yet; the entry it becomes
# is in the decision, "The Apple entry, once the tools know the base".
id: disclosure
status: draft
description: >-
  The collapse chevron of a group that folds and unfolds: westron's style on the platform's own disclosure group, which
  keeps its role, its expanded or collapsed value and its binding. The group is a header and the content under it; the
  header is the product's label and, at its trailing end, the chevron. Only the chevron folds and unfolds the group:
  the label is the product's and keeps whatever it does, such as a list's row that opens the list or a block's title
  that opens the block as a screen (decisions/0001, Q1). The chevron is the icon registry's chevron glyph in
  color.icon.tertiary, sized and weighted by the text role that reaches the style, at the platform's small symbol
  scale, sitting on the label's first text baseline as a letter does (design-language/07, "Size relative to text"). It
  points down while the group is expanded and to the trailing side while it is collapsed, right in a left-to-right
  layout and left in a right-to-left one, and it turns a quarter between them, away from the trailing side as the
  group opens. Its cell stands after the label, at the header's trailing edge; where the label is a ListRow (#119) the
  cell is the last place of the row's trailing slot, inside the row, so that the row's background, hover, selection
  and sideways pinning run under it (decisions/0001, Q2). There is no leading placement and no variant per use: a tree
  branch and a block header differ only in the label the product passes (decisions/0001, P3, Q3). The content stands
  directly under the header, flush with its leading edge, with no indentation and no gap of the style's own: a
  branch's child rows are indented by their own nesting level, a block's rows are not indented at all. The cell is a
  laid-out frame at least size.target.minimum high and across, 44 pt on iOS and 28 pt on macOS, the glyph centred in
  it, so that it never hands its presses to the label beside it, nor takes the label's. Under the pointer the cell
  shows a circle of size.control.s, growing with the glyph, in color.background.hover; pressed, in
  color.background.pressed, and the chevron scales down to 98 % in motion.press; the tint changes in motion.fade. A
  toggle by the chevron or the keyboard moves in motion.move, the motion of a section folding (design-language/05):
  the chevron's turn, the content's reveal, which grows from the header's bottom edge with the content fading in, and
  whatever stands after the group, which moves with it. Folding runs the same in reverse. A change of the binding made
  by the product moves as the product's own transaction says. Under Reduce Motion motion.move takes its reduced form
  (decisions/0013): the chevron points its new way at once, with no turn, the content fades in or out, and nothing
  slides; the press keeps its tint and loses its scale. Disabled draws the chevron and its cell at opacity.disabled,
  with no hover or press; the group keeps its expansion, and the label and the content are the product's, which
  .disabled reaches as it reaches any view. The chevron meets 3:1 as a non-text glyph on the canvas, the surface, the
  sunken ground, the hover and pressed tints and a selected row, 4.5:1 in high contrast (color.icon.tertiary's
  declared pairs).
consumers: [todo-app/lists-screen, todo-app/list-screen]

options:
  variant:
    type: enum
    values: [chevron]
    description: >-
      The chevron; the only variant, so that a call reads .disclosureGroupStyle(.chevron). The system's only style
      name, automatic, is not a value: westron's overload would shadow it (decisions/0003). A tree branch and a block
      header are not variants: they differ in the label, not in the control (decisions/0001, P3).

slots: [label, content]
states: [expanded, hover, focus, pressed, disabled]

tokens:
  chevron.color: color.icon.tertiary
  chevron.turnMotion: motion.move
  indicator.shape: capsule
  indicator.size: size.control.s
  indicator.background:
    cases:
      # Disabled comes first: it excludes hover and pressed.
      - { when: { state: disabled }, token: null }
      - { when: { state: pressed }, token: color.background.pressed }
      - { when: { state: hover }, token: color.background.hover }
  indicator.opacity:
    cases:
      - { when: { state: disabled }, token: opacity.disabled }
  indicator.pressMotion: motion.press
  indicator.hoverMotion: motion.fade
  hitArea.size: size.target.minimum
  content.revealMotion: motion.move
  focusRing.color: color.border.focus
  focusRing.width: stroke.thick

accessibility:
  role: disclosure
  intents: [toggle]
  keyboardIntents: [toggle]
  label: required
  states: { expanded: expanded, disabled: disabled }
  description: >-
    The platform's own disclosure: one element, the chevron, with the role of the platform's disclosure control,
    named by the label's text and announced with its value, expanded or collapsed, in the platform's words; activating
    it toggles the group. The chevron is never named after its glyph or its action ("Expand", "Fold"): the role and
    the value say what it does, as the system's own disclosure triangle does. The label stays its own element or
    elements, with its own action if it has one, read before the chevron (decisions/0001, Q4). The content is read
    only while the group is expanded. In disabled, the chevron is announced as unavailable.

platforms:
  apple:
    status: planned
    description: >-
      Designed, not entered as a strategy yet: spec check does not know the base (decisions/0001, "What the tools
      need"). The design: style-on-system-control on SwiftUI.DisclosureGroup, .disclosureGroupStyle(.chevron), a
      DisclosureGroupStyle (iOS 16 and macOS 13, so on westron's minimum iOS 17 and macOS 14 without availability
      checks); expanded is configuration.isExpanded, the system's binding, which the product passes as
      DisclosureGroup(isExpanded:) or leaves to the group's own state. The style draws the header, the chevron's cell
      and the content's placement and reveal; the label, the content, the binding and the role stay the system's.
      The chevron's cell is a system Button that toggles configuration.isExpanded in motion.move, drawn by a
      ButtonStyle that sees isPressed, its hover and focus followed as Checkbox's are; for assistive technology it is
      represented by the system's own DisclosureGroup on the same binding and label in its automatic style
      (accessibilityRepresentation), so that assistive technology meets the system's disclosure role and its
      expanded or collapsed value and no button, which the implementation measures on iOS 17 and 26 and macOS 14 and
      26 before the second gate, as Checkbox's P19 was. The focus ring is the system's, so the focusRing bindings do
      not apply, as for Button. The style applies to every DisclosureGroup under the modifier outside a List,
      OutlineGroup's included; inside a List the system may draw its own disclosure indicator, and the contract does
      not promise westron's look there (decisions/0001, Q5): the pilot's tree is recursive DisclosureGroups in a
      lazy stack. iOS: hover only with a pointer, on iPad; the cell at least 44 pt. macOS: the cell at least 28 pt;
      with the chevron focused, Space toggles it, as the system button's activation, and the Right and Left arrows
      expand and collapse it (mirrored right to left), as an outline's disclosure triangle does, through
      onMoveCommand. watchOS: SwiftUI has no DisclosureGroup and no DisclosureGroupStyle there (both
      @available(watchOS, unavailable) in the SwiftUI interface of Xcode 27.1), so the component does not exist on
      watchOS; #34 decides the watch's subset, and a product folds there by other means.
  web:
    strategy: style-on-system-control
    base: button
    description: >-
      Provisional until phase 6 (#40): the disclosure pattern of ARIA, a native <button> holding the chevron, with
      aria-expanded and aria-controls naming the content, labelled by the label (aria-labelledby), with westron's CSS;
      the content is hidden while collapsed. Not <details> and <summary>: a summary toggles on the whole header, while
      only the chevron toggles here (decisions/0001, Q1). The focus ring is an outline in focusRing.color and
      focusRing.width on :focus-visible.
  linux:
    status: planned
    description: >-
      Phase 7 decides between the stock GtkExpander, whose whole label toggles the group, and GtkTreeExpander, the
      expander of a GtkListView's tree row, whose arrow alone toggles it, for a tree branch; the difference from the
      chevron-only header is recorded here then.
  android:
    status: planned
