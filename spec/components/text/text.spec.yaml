# westron's Text contract (#27), approved by the owner on 2026-11-18: decisions/0001-text-contract.md records the
# owner's answers, the options considered and the proposals the owner confirmed on top of them.
id: text
status: approved
description: >-
  A text role on the platform's own text view: westron adds no text type of its own, only the role. A role sets the
  font and the tracking and nothing else; the product sets the color with a color role, and the heading semantics
  itself. The roles are the typography tokens, all seventeen, named as the tokens are (design-language/03). On Apple
  a role follows its text style, so it scales with Dynamic Type and takes the Mac's sizes on macOS. Tracking is a
  percentage of the size the font is drawn at, on every platform and at every text size: headings are tracked in by
  1 %, the overline out by 6 %, each the token's letterSpacing over its fontSize. With the system's Bold Text setting
  on, a role in Onest or Geist Mono draws heavier, as the system font does by itself: Onest SemiBold to Bold and
  Bold to ExtraBold, Geist Mono Regular to SemiBold and SemiBold to Bold. Line height comes from the font. The
  component has no states. Running text wraps; a one-line label may truncate with an ellipsis when its full text is
  reachable, and the line limit is the platform's own (design-language/03, "Capitals, numbers and fitting").
consumers: [todo-app/lists-screen, todo-app/list-screen]

options:
  role:
    type: tokens
    group: typography
    description: >-
      No default: every use names its role. The values are the tokens under typography, by their path after it,
      heading.large to code.strong, so the contract and the tokens cannot drift. A role is chosen by what the text is,
      never by its size; a product that needs a size the roles do not have asks for a new role (design-language/03).

slots: [label]

accessibility:
  role: text
  description: >-
    The text is its own accessible label; a role adds no trait. A heading role does not make the text a heading for
    assistive technology: the product marks a heading where the screen's structure has one, on Apple with
    .accessibilityAddTraits(.isHeader). The text scales with the person's text size and never drops below the
    contrast target, whatever its size (design-language/02, 08).

platforms:
  apple:
    strategy: extension-on-system-control
    base: SwiftUI.Text
    description: >-
      The role is the token accessor Westron.TextRole, whose names already follow the tokens, so the call is
      .textRole(.heading.large) on any view. Text.textRole(_:) returns a Text, so that a part of a text keeps its own
      role and tracking: inside Text interpolation, Text("\(name) \(Text(count).textRole(.footnote.medium))"), and
      in Text + Text, which OS 26 deprecates for interpolation. Font(.body.regular) gives the face without the
      tracking, where only a font fits.
      A role in Onest or Geist Mono is Font.custom(_:size:relativeTo:) at its text style's size on that OS, the
      system font's roles Font.system(_:design:weight:); the tracking is recomputed from the size Dynamic Type draws.
      Under Bold Text (legibilityWeight .bold) a role in Onest or Geist Mono takes the heavier weight the
      description names; the system font does so by itself. Line height is the font's own (design-language/03, "Tracking and line height"). The line
      limit and truncation are SwiftUI's .lineLimit and .truncationMode.
    watchos:
      description: >-
        Every role is drawn in the system font, in its text style at the watch's sizes, with the role's weight; the
        code roles in the system's monospaced design. Onest and Geist Mono are not used on the watch, as the research
        suggests for its screen size (research_notes/type-and-icons.md, 3.1). The tracking still applies, as a
        percentage of the size the watch draws.
  web:
    status: planned
    description: >-
      Provisional until phase 6 (#40): a CSS class per role on the native element the product chooses, so a heading
      stays an <h1>…<h6> where the product makes it one; letter-spacing in em, so the tracking follows the size; Bold
      Text has no web counterpart. No single element is the base, so the strategy waits for #40.
  linux:
    strategy: style-on-system-control
    base: GtkLabel
    description: >-
      Provisional until phase 7: a style class per role on the stock GtkLabel, as GtkButton takes its classes, with
      letter-spacing in em. Whether a heading role keeps or replaces libadwaita's title classes (.title-1 … .title-4,
      .heading) is design-language/09's open question 4, decided there.
  android:
    status: planned
